name: Android CI & Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle Wrapper and Dependencies
        run: |
          mkdir -p gradle/wrapper

          # 1. إذا كان ملف gradle-wrapper.jar مفقوداً في المستودع، يتم تنزيله تلقائياً لحل المشكلة
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar not found! Downloading..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/master/gradle/wrapper/gradle-wrapper.jar
          fi

          # 2. التأكد من وجود ملف إعدادات gradle-wrapper.properties
          if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
            cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          fi

          # 3. التأكد من وجود أداة gradlew ومنحها صلاحيات التنفيذ لمنع خطأ 127
          if [ ! -s "gradlew" ]; then
            curl -sLo gradlew https://raw.githubusercontent.com/gradle/gradle/master/gradlew
          fi
          chmod +x gradlew

      - name: Setup Keystore & Environment
        run: |
          # تجهيز ملف البيئة .env إذا وجد
          if [ -f .env.example ] && [ ! -f .env ]; then
            cp .env.example .env
          fi

          # إنشاء وتجهيز مفتاح debug.keystore تلقائياً
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
